---
# Internal package sets used while Python modules are not yet available.
_bootstrap_packages:
  dnf5:
    - python3
    - python3-dnf
    - python3-libdnf5
  dnf: &bootstrap_dnf_packages
    - python3
    - python-dnf
  yum: *bootstrap_dnf_packages
  apt:
    - python3
    - python3-apt

_bootstrap_pkg_mgr_by_rc:
  10: dnf5
  11: dnf
  12: yum
  13: apt
  14: unknown
