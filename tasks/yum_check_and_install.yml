---
- name: Check whether package is installed on yum systems
  ansible.builtin.raw: "rpm -q {{ package_name }}"
  register: bootstrap_package_check
  changed_when: false
  failed_when: false
  tags:
    - bootstrap
    - validate

- name: Install missing package on yum systems
  ansible.builtin.raw: "yum install -y {{ package_name }}"
  when: bootstrap_package_check.rc != 0
  changed_when: true
  tags:
    - bootstrap
    - install
