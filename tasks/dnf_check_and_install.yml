---
- name: Check if package {{ package_name }} is installed
  ansible.builtin.raw: "rpm -q {{ package_name }}"
  register: cmd_check
  changed_when: false
  failed_when: false

- name: Install missing packages
  ansible.builtin.raw: "dnf install -y {{ package_name }}"
  when:
    - cmd_check.rc != 0
  changed_when: true
