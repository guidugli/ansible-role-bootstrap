---
- name: Preserve the configured SSH port
  ansible.builtin.set_fact:
    bootstrap_configured_port: "{{ ansible_port }}"
  tags:
    - bootstrap
    - config

- name: Check the default SSH port from the controller
  ansible.builtin.wait_for:
    port: 22
    state: started
    host: "{{ ansible_host | default(inventory_hostname) }}"
    connect_timeout: 5
    timeout: 10
  delegate_to: localhost
  failed_when: false
  register: bootstrap_default_ssh
  tags:
    - bootstrap
    - validate

- name: Select the default SSH port when reachable
  ansible.builtin.set_fact:
    ansible_port: 22
  when: not bootstrap_default_ssh.failed
  register: bootstrap_ssh_port_set
  tags:
    - bootstrap
    - config

- name: Check the configured SSH port from the controller
  ansible.builtin.wait_for:
    port: "{{ bootstrap_configured_port }}"
    state: started
    host: "{{ ansible_host | default(inventory_hostname) }}"
    connect_timeout: 5
    timeout: 10
  delegate_to: localhost
  failed_when: false
  register: bootstrap_configured_ssh
  when: bootstrap_default_ssh.failed
  tags:
    - bootstrap
    - validate

- name: Select the configured SSH port when reachable
  ansible.builtin.set_fact:
    ansible_port: "{{ bootstrap_configured_port }}"
  when:
    - bootstrap_configured_ssh is not skipped
    - not bootstrap_configured_ssh.failed
  register: bootstrap_ssh_port_set
  tags:
    - bootstrap
    - config

- name: Fail when neither SSH port is reachable
  ansible.builtin.fail:
    msg: "Neither SSH port 22 nor configured port {{ bootstrap_configured_port }} is reachable."
  when: bootstrap_ssh_port_set is undefined
  tags:
    - bootstrap
    - validate

- name: Gather deferred facts after SSH port selection
  ansible.builtin.setup:
  tags:
    - bootstrap
    - validate
