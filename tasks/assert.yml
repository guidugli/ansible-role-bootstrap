---
- name: Validate additional bootstrap package names
  ansible.builtin.assert:
    that:
      - item is string
      - item | trim | length > 0
      - item is match('^[A-Za-z0-9][A-Za-z0-9+_.:-]*$')
    fail_msg: >-
      Each bootstrap_extra_packages entry must be a non-empty package name containing only
      letters, digits, plus, underscore, period, colon, and hyphen. Invalid value: {{ item | to_json }}
    quiet: true
  loop: "{{ bootstrap_extra_packages }}"
  tags:
    - bootstrap
    - validate
