---
argument_specs:
  main:
    short_description: Bootstrap a host for Ansible management
    description:
      - Install the minimum Python runtime and package-manager bindings required by Ansible.
      - Optionally detect the SSH port before deferred fact gathering.
    options:
      bootstrap_detect_ssh_port:
        type: bool
        required: false
        default: true
        description:
          - Attempt SSH port auto-detection before deferred fact gathering.
      bootstrap_fail_on_unknown_pkg_mgr:
        type: bool
        required: false
        default: true
        description:
          - Fail when no supported package manager is detected.
      bootstrap_extra_packages:
        type: list
        elements: str
        required: false
        default: []
        description:
          - Additional packages installed after the backend-specific bootstrap packages.
