---
- name: Verify bootstrap role
  hosts: all
  gather_facts: true
  tasks:
    - name: Check the Python 3 command
      ansible.builtin.command:
        argv:
          - python3
          - --version
      register: bootstrap_python3
      changed_when: false
      tags:
        - bootstrap
        - validate

    - name: Assert Python 3 is available
      ansible.builtin.assert:
        that:
          - bootstrap_python3.rc == 0
        fail_msg: python3 is not available after bootstrap.
        quiet: true
      tags:
        - bootstrap
        - validate

    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: auto
      tags:
        - bootstrap
        - validate

    - name: Load the role package map for verification
      ansible.builtin.include_vars:
        file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/vars/main.yml"
        name: bootstrap_role_internal_vars
      tags:
        - bootstrap
        - validate

    - name: Build the expected package list for the detected backend
      ansible.builtin.set_fact:
        bootstrap_expected_packages: >-
          {{
            bootstrap_role_internal_vars['_bootstrap_packages'].get(
              ansible_facts['pkg_mgr'], []
            )
          }}
      tags:
        - bootstrap
        - validate

    - name: Assert expected bootstrap packages are installed
      ansible.builtin.assert:
        that:
          - item in ansible_facts['packages']
        fail_msg: "Expected bootstrap package is missing: {{ item }}"
        quiet: true
      loop: "{{ bootstrap_expected_packages }}"
      tags:
        - bootstrap
        - validate

    - name: Simulate package-manager output with an OSC 3008 suffix
      ansible.builtin.set_fact:
        bootstrap_test_pkg_mgr_output: "dnf5\r\n\u001b]3008;end=test-context\u001b\\"
      tags:
        - bootstrap
        - validate

    - name: Parse the simulated package-manager output
      ansible.builtin.set_fact:
        bootstrap_test_pkg_mgr: >-
          {{
            bootstrap_test_pkg_mgr_output
            | regex_search('^(dnf5|dnf|yum|apt|unknown)')
            | default('unknown', true)
          }}
      tags:
        - bootstrap
        - validate

    - name: Assert OSC-contaminated output is parsed correctly
      ansible.builtin.assert:
        that:
          - bootstrap_test_pkg_mgr == 'dnf5'
        fail_msg: >-
          Package-manager detection did not tolerate an OSC terminal context suffix.
        quiet: true
      tags:
        - bootstrap
        - validate

    - name: Verify package-manager parsing with terminal output contamination
      vars:
        bootstrap_pkg_mgr_test_cases:
          - input: "dnf5\r\n\u001b]3008;end=test-context\u001b\\"
            expected: dnf5
          - input: "dnf\r\n\u001b]3008;end=test-context\u001b\\"
            expected: dnf
          - input: "yum\r\n\u001b]3008;end=test-context\u001b\\"
            expected: yum
          - input: "apt\r\n\u001b]3008;end=test-context\u001b\\"
            expected: apt
      ansible.builtin.assert:
        that:
          - >-
            (
              item.input
              | regex_search('^(dnf5|dnf|yum|apt|unknown)')
              | default('unknown', true)
            ) == item.expected
        fail_msg: >-
          Package-manager parser returned an unexpected value for
          {{ item.expected }}.
        quiet: true
      loop: "{{ bootstrap_pkg_mgr_test_cases }}"
      loop_control:
        label: "{{ item.expected }}"
      tags:
        - bootstrap
        - validate
